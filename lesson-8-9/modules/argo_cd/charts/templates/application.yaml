apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-app
  namespace: argocd

spec:
  project: default
  revisionHistoryLimit: 2

  source:
    repoURL: https://github.com/Natalina686/my-microservice-project.git
    path: charts/django-app
    targetRevision: main

  destination:
    server: https://kubernetes.default.svc
    namespace: django

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true